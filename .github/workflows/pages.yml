name: Test & deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test packages
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  # Publishes the bundled MCP server to the `dist` branch so agents can run
  #   npx -y github:kucukkanat/kurultay#dist mcp      (any MCP host)
  #   pi install git:github.com/kucukkanat/kurultay@dist
  # without an npm release. The bundle is a single file with zero dependencies.
  dist-branch:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/mcp build
      - name: Assemble package (npx bin + pi package + skill)
        run: scripts/assemble-dist.sh out
      - name: Push to dist branch
        run: |
          cd out
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "kurultay MCP server build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
