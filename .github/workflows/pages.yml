name: Test & deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # the sandbox integration tests run real sandboxes: Linux needs bubblewrap, socat and ripgrep, and Ubuntu 24.04
      # must allow unprivileged user namespaces (docs/sandbox.md); without them those tests skip with the reason
      - name: Sandbox tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bun run test
      # version-bump guard: fails when the CLI, core or skill sources changed since the published `dist` branch but
      # packages/mcp's version did not (docs- and test-only changes keep the build hash, so they pass)
      - run: bun run --cwd packages/mcp check:version

  # Publishes the bundled MCP server to the `dist` branch so agents can run
  #   npx -y github:kucukkanat/kurultay#dist mcp      (any MCP host)
  #   pi install git:github.com/kucukkanat/kurultay@dist
  # without an npm release. The bundle is one file with zero dependencies, plus the sandbox's helper programs in dist/vendor.
  dist-branch:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/mcp build
      - name: Assemble package (npx bin + pi package + skill)
        run: scripts/assemble-dist.sh out
      - name: Push to dist branch
        id: push
        run: |
          cd out
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "kurultay MCP server build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The app's "Add your agents" command pins the exact dist commit, so npx never runs a stale cached build.
  site:
    needs: [test, dist-branch]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_DIST_REF: ${{ needs.dist-branch.outputs.sha || 'dist' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
